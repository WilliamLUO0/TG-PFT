# general settings
name: TGPFT_SRx8_u
model_type: FMSRModel
scale: 8
num_gpu: 4
manual_seed: 61
find_unused_parameters: true

# dataset and data loader settings
datasets:
  train:
    name: FloodMapSR-Train-u
    type: PairedFloodMapDataset
    dataroot: datasets/dataset_ds8_filtered_thr0p1_min5100_full
    index_csv: datasets/dataset_ds8_filtered_thr0p1_min5100_full/index_with_severity_stats_u.csv
    io_backend:
      type: disk
    phase: train
    target_var: u
    aux_vars: [dem]
    scale: 8
    patch_fine: 512
    patch_coarse: 64
    use_hflip: true
    use_rot: true
    split_cfg:
      by: scenario
      val_ratio: 0.2
      seed: 61
      split_stats_json: datasets/dataset_ds8_filtered_thr0p1_min5100_full/split_stats_u.json
    sampler:
      type: severity_balanced
      summary_json: datasets/dataset_ds8_filtered_thr0p1_min5100_full/patch_severity_summary_u.json
      percentile_source: positive
      low_percentile: p75
      high_percentile: p99
      slight_alpha: 4.0
      severe_alpha: 2.0
      extreme_alpha: 2.0
      base_weight: 1.0
      max_weight: 10.0
    num_worker_per_gpu: 8
    batch_size_per_gpu: 4
    dataset_enlarge_ratio: 1
    prefetch_mode: cuda
    pin_memory: true
    persistent_workers: true
  val_1:
    name: FloodMapSR-Val-u
    type: PairedFloodMapDataset
    dataroot: datasets/dataset_ds8_filtered_thr0p1_min5100_full
    index_csv: datasets/dataset_ds8_filtered_thr0p1_min5100_full/index_with_severity_stats_u.csv
    io_backend:
      type: disk
    phase: val
    target_var: u
    aux_vars: [dem]
    scale: 8
    patch_fine: 512
    patch_coarse: 64
    split_cfg:
      by: scenario
      val_ratio: 0.2
      seed: 61
      split_stats_json: datasets/dataset_ds8_filtered_thr0p1_min5100_full/split_stats_u.json

# network structures
network_g:
  type: TGPFT
  upscale: 8
  coarse_in_chans: 2
  static_in_chans: 7
  flood_map_size: 64
  use_shallow_act: true
  use_decoder_act: true
  use_global_residual: true
  use_aoi_gate: true
  aoi_alpha: 0.5
  couple_mode: none
  couple_eps: 0.2
  embed_dim: 96
  depths: [2, 4, 6, 6]
  num_heads: 6
  num_topk: [256, 256, 128, 128, 128, 128, 64, 64, 64, 64, 64, 64, 32, 32, 32, 32, 32, 32]
  window_size: 16
  convffn_kernel_size: 7
  mlp_ratio: 2.0
  upsampler: pixelshuffle
  resi_connection: 1conv
  use_checkpoint: false

# path
path:
  pretrain_network_g: ~
  strict_load_g: true
  resume_state: ~

# training settings
train:
  ema_decay: 0.999
  optim_g:
    type: AdamW
    lr: !!float 5e-4
    weight_decay: 0
    betas: [0.9, 0.99]
  scheduler:
    type: MultiStepLR
    milestones: [150000, 300000, 500000, 700000, 900000]
    gamma: 0.5
  total_iter: 1000000
  warmup_iter: 40000
  pixel_opt:
    type: MaskL1Loss
    loss_weight: 1.0
    ignore_zero_mask: true
    eps: 1.0e-12
  ordinal_opt:
    type: MaskOrdinalBCELoss
    loss_weight: 0.2
    tau1_m: 0.1
    tau2_m: 0.5
    tau3_m: 1.0
    abs_target: true
    var: u
    stats_json: datasets/dataset_ds8_filtered_thr0p1_min5100_full/split_stats_u.json
    pos_weight_min: 1.0
    pos_weight_max: 10.0
    ignore_zero_mask: true
    eps: 1.0e-12

# validation settings
val:
  val_freq: !!float 4e4
  save_flood_map: false
  metrics:
    rmse:
      type: cal_rmse_pt
      reduction: mean
      better: lower
    nse:
      type: cal_nse_pt
      reduction: mean
      better: higher
    rmse_nonflood01:
      type: cal_rmse_conditional_pt
      reduction: none
      cond_on_target_ge: 0.0
      cond_on_target_lt: 0.1
      use_abs: true
      better: lower
    rmse_slight01_05:
      type: cal_rmse_conditional_pt
      reduction: none
      cond_on_target_ge: 0.1
      cond_on_target_lt: 0.5
      use_abs: true
      better: lower
    rmse_severe05_1:
      type: cal_rmse_conditional_pt
      reduction: none
      cond_on_target_ge: 0.5
      cond_on_target_lt: 1
      use_abs: true
      better: lower
    rmse_extreme1:
      type: cal_rmse_conditional_pt
      reduction: none
      cond_on_target_ge: 1
      cond_on_target_lt: ~
      use_abs: true
      better: lower
    csi_thr01:
      type: cal_csi_pt
      threshold: 0.1
      reduction: mean
      empty_as_nan: true
      use_abs: true
      better: higher
    precision_thr01:
      type: cal_precision_pt
      threshold: 0.1
      reduction: mean
      empty_as_nan: true
      use_abs: true
      better: higher
    recall_thr01:
      type: cal_recall_pt
      threshold: 0.1
      reduction: mean
      empty_as_nan: true
      use_abs: true
      better: higher
    precision_nonflood01:
      type: cal_precision_band_pt
      band_ge: 0.0
      band_lt: 0.1
      reduction: mean
      empty_as_nan: true
      use_abs: true
      better: higher
    precision_slight01_05:
      type: cal_precision_band_pt
      band_ge: 0.1
      band_lt: 0.5
      reduction: mean
      empty_as_nan: true
      use_abs: true
      better: higher
    precision_severe05_1:
      type: cal_precision_band_pt
      band_ge: 0.5
      band_lt: 1
      reduction: mean
      empty_as_nan: true
      use_abs: true
      better: higher
    precision_extreme1:
      type: cal_precision_band_pt
      band_ge: 1
      band_lt: ~
      reduction: mean
      empty_as_nan: true
      use_abs: true
      better: higher
    recall_nonflood01:
      type: cal_recall_band_pt
      band_ge: 0.0
      band_lt: 0.1
      reduction: mean
      empty_as_nan: true
      use_abs: true
      better: higher
    recall_slight01_05:
      type: cal_recall_band_pt
      band_ge: 0.1
      band_lt: 0.5
      reduction: mean
      empty_as_nan: true
      use_abs: true
      better: higher
    recall_severe05_1:
      type: cal_recall_band_pt
      band_ge: 0.5
      band_lt: 1
      reduction: mean
      empty_as_nan: true
      use_abs: true
      better: higher
    recall_extreme1:
      type: cal_recall_band_pt
      band_ge: 1
      band_lt: ~
      reduction: mean
      empty_as_nan: true
      use_abs: true
      better: higher

# logging settings
logger:
  print_freq: 100
  save_checkpoint_freq: !!float 5e3
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~

# dist training settings
dist_params:
  backend: nccl
  port: 29500
