# general settings
name: TGPFT_SRx8_v_val
model_type: FMSRModel
scale: 8
num_gpu: 1
manual_seed: 61

# dataset and data loader settings
datasets:
  val_1:
    name: FloodMapSR-Val-v
    type: PairedFloodMapDataset
    dataroot: datasets/dataset_ds8_filtered_thr0p1_min5100_full
    index_csv: datasets/dataset_ds8_filtered_thr0p1_min5100_full/index_with_severity_stats_v.csv
    io_backend:
      type: disk
    phase: val
    target_var: v
    aux_vars: [dem]
    scale: 8
    patch_fine: 512
    patch_coarse: 64
    split_cfg:
      by: scenario
      val_ratio: 0.2
      seed: 61
      split_stats_json: datasets/dataset_ds8_filtered_thr0p1_min5100_full/split_stats_v.json

# network structures
network_g:
  type: TGPFT
  upscale: 8
  coarse_in_chans: 2
  static_in_chans: 7
  flood_map_size: 64
  use_shallow_act: true
  use_decoder_act: true
  use_global_residual: true
  use_aoi_gate: true
  aoi_alpha: 0.5
  couple_mode: none
  couple_eps: 0.2
  embed_dim: 96
  depths: [2, 4, 6, 6]
  num_heads: 6
  num_topk: [256, 256, 128, 128, 128, 128, 64, 64, 64, 64, 64, 64, 32, 32, 32, 32, 32, 32]
  window_size: 16
  convffn_kernel_size: 7
  mlp_ratio: 2.0
  upsampler: pixelshuffle
  resi_connection: 1conv
  use_checkpoint: false

# path
path:
  pretrain_network_g: experiments/TGPFT_SRx8_v/models/net_g_1000000.pth
  strict_load_g: true
  param_key_g: params_ema

# validation settings
val:
  save_flood_map: true
  suffix: ~
  metrics:
    rmse:
      type: cal_rmse_pt
      reduction: mean
      better: lower
    nse:
      type: cal_nse_pt
      reduction: mean
      better: higher
    rmse_nonflood01:
      type: cal_rmse_conditional_pt
      reduction: none
      cond_on_target_ge: 0.0
      cond_on_target_lt: 0.1
      use_abs: true
      better: lower
    rmse_slight01_05:
      type: cal_rmse_conditional_pt
      reduction: none
      cond_on_target_ge: 0.1
      cond_on_target_lt: 0.5
      use_abs: true
      better: lower
    rmse_severe05_1:
      type: cal_rmse_conditional_pt
      reduction: none
      cond_on_target_ge: 0.5
      cond_on_target_lt: 1
      use_abs: true
      better: lower
    rmse_extreme1:
      type: cal_rmse_conditional_pt
      reduction: none
      cond_on_target_ge: 1
      cond_on_target_lt: ~
      use_abs: true
      better: lower
    csi_thr01:
      type: cal_csi_pt
      threshold: 0.1
      reduction: mean
      empty_as_nan: true
      use_abs: true
      better: higher
    precision_thr01:
      type: cal_precision_pt
      threshold: 0.1
      reduction: mean
      empty_as_nan: true
      use_abs: true
      better: higher
    recall_thr01:
      type: cal_recall_pt
      threshold: 0.1
      reduction: mean
      empty_as_nan: true
      use_abs: true
      better: higher
    precision_nonflood01:
      type: cal_precision_band_pt
      band_ge: 0.0
      band_lt: 0.1
      reduction: mean
      empty_as_nan: true
      use_abs: true
      better: higher
    precision_slight01_05:
      type: cal_precision_band_pt
      band_ge: 0.1
      band_lt: 0.5
      reduction: mean
      empty_as_nan: true
      use_abs: true
      better: higher
    precision_severe05_1:
      type: cal_precision_band_pt
      band_ge: 0.5
      band_lt: 1
      reduction: mean
      empty_as_nan: true
      use_abs: true
      better: higher
    precision_extreme1:
      type: cal_precision_band_pt
      band_ge: 1
      band_lt: ~
      reduction: mean
      empty_as_nan: true
      use_abs: true
      better: higher
    recall_nonflood01:
      type: cal_recall_band_pt
      band_ge: 0.0
      band_lt: 0.1
      reduction: mean
      empty_as_nan: true
      use_abs: true
      better: higher
    recall_slight01_05:
      type: cal_recall_band_pt
      band_ge: 0.1
      band_lt: 0.5
      reduction: mean
      empty_as_nan: true
      use_abs: true
      better: higher
    recall_severe05_1:
      type: cal_recall_band_pt
      band_ge: 0.5
      band_lt: 1
      reduction: mean
      empty_as_nan: true
      use_abs: true
      better: higher
    recall_extreme1:
      type: cal_recall_band_pt
      band_ge: 1
      band_lt: ~
      reduction: mean
      empty_as_nan: true
      use_abs: true
      better: higher
